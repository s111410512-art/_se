version: '3.8'

services:
  # 1. PostgreSQL 資料庫服務
  db:
    image: postgres:15-alpine
    container_name: demo_postgres
    restart: always
    environment:
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
      POSTGRES_DB: demo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d demo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js 後端 API 服務
  backend:
    build: ./backend
    container_name: demo_backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: demo_user
      DB_PASSWORD: demo_password
      DB_NAME: demo_db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  # 3. Nginx Web Server 與反向代理
  nginx:
    image: nginx:alpine
    container_name: demo_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata: