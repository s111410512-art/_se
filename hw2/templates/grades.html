<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>校務系統 - 學期成績查詢</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">校務系統</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard">首頁公告</a></li>
                <li class="nav-item"><a class="nav-link" href="/course_select">選課系統</a></li>
                <li class="nav-item"><a class="nav-link active" href="/grades">成績查詢</a></li>
                <li class="nav-item"><a class="nav-link" href="/timetable">我的課表</a></li>
            </ul>
            <span class="navbar-text me-3">{{ name }} 同學</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">登出</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">歷年學期成績查詢</h5>
                </div>
                <div class="card-body">
                    <table class="table table-striped table-hover mt-3">
                        <thead class="table-dark">
                            <tr>
                                <th>學期</th>
                                <th>科目名稱</th>
                                <th>學分</th>
                                <th>成績</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for g in grades %}
                            <tr>
                                <td>{{ g.semester }}</td>
                                <td>{{ g.course_name }}</td>
                                <td>{{ g.credits }}</td>
                                <td><strong>{{ g.score }}</strong></td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center text-muted">目前查無成績資料</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    <div class="text-end mt-3">
                        <h5>學期平均分數: <span class="text-danger">{{ avg_score }}</span> 分</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
