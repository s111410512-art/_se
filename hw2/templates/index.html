<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">校務系統</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/dashboard">首頁公告</a></li>
                <li class="nav-item"><a class="nav-link" href="/course_select">選課系統</a></li>
                <li class="nav-item"><a class="nav-link" href="/grades">成績查詢</a></li>
                <li class="nav-item"><a class="nav-link" href="/timetable">我的課表</a></li>
            </ul>
            <span class="navbar-text me-3">歡迎，{{ name }} 同學</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">登出</a>
        </div>
    </div>

<div class="container mt-4">
    <h3 class="text-danger">系統公告</h3>
    <hr>
    <div class="list-group">
        <a href="#" class="list-group-item list-group-item-action">
            <h5 class="mb-1">學期成績單全面以電子查詢公告</h5>
            <small>為響應無紙化校園政策，不再寄發紙本成績通知單...</small>
        </a>
        <a href="#" class="list-group-item list-group-item-action">
            <h5 class="mb-1">日間部停修申請公告</h5>
            <small>停修後總修課學分數仍不得低於該學期應修最低學分數...</small>
        </a>
        <a href="#" class="list-group-item list-group-item-action">
            <h5 class="mb-1">通識志願選課結果公告</h5>
            <small>請務必上網查詢篩選結果，確認課表是否衝堂。</small>
        </a>
    </div>
