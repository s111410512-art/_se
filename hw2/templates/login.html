<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>模擬金大校務系統 - 登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>模擬校務行政資訊系統</h4>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label>帳號 (學號/身分證號)</label>
                            <input type="text" name="user_id" class="form-control" required placeholder="輸入 11200001">
                        </div>
                        <div class="mb-3">
                            <label>密碼</label>
                            <input type="password" name="password" class="form-control" required placeholder="輸入 123">
                        </div>
                        <div class="mb-3">
                            <label>驗證碼 (請輸入1234)</label>
                            <div class="d-flex">
                                <input type="text" name="captcha" class="form-control me-2" required>
                                <img src="https://dummyimage.com/100x40/000/fff&text=1234" alt="captcha" class="border">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登入系統</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
