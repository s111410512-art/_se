<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>校務系統 - 我的課表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .course-cell {
            height: 60px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">校務系統</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard">首頁公告</a></li>
                <li class="nav-item"><a class="nav-link" href="/course_select">選課系統</a></li>
                <li class="nav-item"><a class="nav-link" href="/grades">成績查詢</a></li>
                <li class="nav-item"><a class="nav-link active" href="/timetable">我的課表</a></li>
            </ul>
            <span class="navbar-text me-3">{{ name }} 同學</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">登出</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">本學期個人課表</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-bordered table-striped text-center mb-0">
                <thead class="table-dark">
                    <tr>
                        <th width="10%">節次 \ 星期</th>
                        {% for day in days %}
                            <th width="18%">星期{{ day }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for period in periods %}
                    <tr>
                        <td class="fw-bold align-middle">第 {{ period }} 節</td>
                        {% for day in days %}
                            <td class="course-cell">
                                {% if schedule[period][day] %}
                                    <span class="badge bg-success fs-6 w-100 p-2 shadow-sm">{{ schedule[period][day] }}</span>
                                {% endif %}
                            </td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
