<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多功能計時器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .tabs {
      display: flex;
      background: #334155;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .timer-display {
      font-size: 56px;
      font-weight: 700;
      font-family: monospace;
      margin: 20px 0 30px;
      letter-spacing: 2px;
      color: #f8fafc;
    }

    .inputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-group label {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .inputs input {
      width: 70px;
      padding: 10px;
      font-size: 20px;
      text-align: center;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .inputs input:focus {
      border-color: #38bdf8;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-start { background: #22c55e; color: #fff; }
    .btn-pause { background: #eab308; color: #fff; }
    .btn-reset { background: #ef4444; color: #fff; }

    .laps {
      margin-top: 24px;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 14px;
      color: #cbd5e1;
      border-bottom: 1px solid #1e293b;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchMode('countdown')">倒數計時器</button>
      <button class="tab-btn" onclick="switchMode('stopwatch')">碼錶計時</button>
    </div>

    <!-- 倒數計時輸入區 -->
    <div id="countdown-inputs" class="inputs">
      <div class="input-group">
        <input type="number" id="input-min" min="0" max="99" value="05">
        <label>分鐘</label>
      </div>
      <div class="input-group">
        <input type="number" id="input-sec" min="0" max="59" value="00">
        <label>秒鐘</label>
      </div>
    </div>

    <!-- 時間顯示 -->
    <div class="timer-display" id="display">05:00</div>

    <!-- 控制按鈕 -->
    <div class="controls">
      <button class="btn btn-start" id="start-btn" onclick="startTimer()">開始</button>
      <button class="btn btn-pause hidden" id="pause-btn" onclick="pauseTimer()">暫停</button>
      <button class="btn btn-reset" onclick="resetTimer()">重置</button>
    </div>

    <!-- 碼錶分圈紀錄 -->
    <div class="laps hidden" id="laps-container"></div>
  </div>

  <script>
    let mode = 'countdown'; // 'countdown' | 'stopwatch'
    let timer = null;
    let totalSeconds = 300; // 預設 5 分鐘
    let isRunning = false;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const countdownInputs = document.getElementById('countdown-inputs');
    const minInput = document.getElementById('input-min');
    const secInput = document.getElementById('input-sec');

    // 切換模式
    function switchMode(newMode) {
      if (isRunning) pauseTimer();
      mode = newMode;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (mode === 'countdown') {
        countdownInputs.classList.remove('hidden');
        updateCountdownFromInput();
      } else {
        countdownInputs.classList.add('hidden');
        totalSeconds = 0;
        updateDisplay();
      }
    }

    // 更新顯示文字
    function updateDisplay() {
      const minutes = Math.floor(Math.abs(totalSeconds) / 60);
      const seconds = Math.abs(totalSeconds) % 60;
      display.textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // 從輸入框更新倒數時間
    function updateCountdownFromInput() {
      if (mode !== 'countdown') return;
      const mins = parseInt(minInput.value) || 0;
      const secs = parseInt(secInput.value) || 0;
      totalSeconds = mins * 60 + secs;
      updateDisplay();
    }

    minInput.addEventListener('input', updateCountdownFromInput);
    secInput.addEventListener('input', updateCountdownFromInput);

    // 開始計時
    function startTimer() {
      if (isRunning) return;

      if (mode === 'countdown' && totalSeconds <= 0) return;

      isRunning = true;
      startBtn.classList.add('hidden');
      pauseBtn.classList.remove('hidden');

      timer = setInterval(() => {
        if (mode === 'countdown') {
          totalSeconds--;
          updateDisplay();
          if (totalSeconds <= 0) {
            clearInterval(timer);
            isRunning = false;
            alert('⏰ 時間到！');
            resetTimer();
          }
        } else {
          totalSeconds++;
          updateDisplay();
        }
      }, 1000);
    }

    // 暫停計時
    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
      startBtn.classList.remove('hidden');
      pauseBtn.classList.add('hidden');
    }

    // 重置計時
    function resetTimer() {
      pauseTimer();
      if (mode === 'countdown') {
        updateCountdownFromInput();
      } else {
        totalSeconds = 0;
        updateDisplay();
      }
    }
  </script>
</body>
</html>
